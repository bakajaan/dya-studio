name: Test and Build Web UI

# このワークフローは「検証専用」です。デプロイはしません。
#
# main への push / Pull Request / 手動実行のたびに lint → test → build を
# 通すことだけを担当します。ここが赤くなったら、それはコードが壊れている
# という意味です（資格情報などの環境要因ではありません）。
#
# デプロイの担当:
#   - dev / プレビュー: Cloudflare 側の Git 連携が main を自動でビルドして
#     デプロイします。GitHub Actions からは行いません（同じものを二重に
#     デプロイしていたため、wrangler を使うジョブは削除しました）。
#   - 本番リリース: release.yml

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        # package-lock.json に忠実に入れることで、CI と Cloudflare で同じ
        # 依存バージョンになるようにする。package.json を変えてここが
        # 失敗するようになったときは、Actions タブから
        # "Update package-lock.json" ワークフローを手動実行して
        # ロックを更新する（ローカル作業は不要）。
        run: npm ci --no-audit --no-fund
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build for Cloudflare Workers
        run: npm run build
        env:
          VITE_BASE: /
          # Dev and PR preview deployments keep RPC debug logging on; the
          # production release build (release.yml) leaves this unset.
          VITE_ENABLE_RPC_LOG: "true"
          # Header badge marking a non-production build: "PullRequest" for
          # pull requests, "Dev" for the main branch. The production release
          # build (release.yml) leaves this unset → no badge.
          VITE_BUILD_LABEL: ${{ github.event_name == 'pull_request' && 'PullRequest' || 'Dev' }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
